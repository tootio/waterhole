default: &default
  store_options:
    # Cap age of oldest cache entry to fulfill retention policies
    # max_age: <%= 60.days.to_i %>
    max_size: <%= 256.megabytes %>
    namespace: <%= Rails.env %>

# Waterhole runs Solid Cache in development too (see config/environments/
# development.rb), so it needs the cache database named here exactly as
# production does. Without it Solid Cache falls back to the primary
# connection, where solid_cache_entries does not exist and every read raises.
development:
  database: cache
  <<: *default

test:
  <<: *default

production:
  database: cache
  <<: *default
