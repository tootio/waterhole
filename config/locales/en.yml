en:
  # One entry per rule in Flags.registry. Missing ones raise in development and
  # test (config.i18n.raise_on_missing_translations), so a new rule cannot ship
  # with a humanized key for a name.
  flags:
    no_invite_request:
      label: "No reason given"
      help: "The applicant left the \"why do you want to join\" field empty. Genuine
        applicants usually say something, even briefly, so a blank reason is a weak
        signal worth a second look rather than an automatic rejection."
    short_invite_request:
      label: "Short reason"
      help: "The applicant's join reason was only a few words. Very short reasons are
        sometimes genuine, but they're also what low-effort signup scripts and spam
        accounts tend to produce, so this flag just asks a moderator to read it
        before deciding."
    disposable_email:
      label: "Disposable email"
      help: "The applicant signed up with an address from a known disposable or
        temporary email provider. These are commonly used to create throwaway
        accounts and evade bans, since the address can't be used to contact the
        person again."
    shared_ip:
      label: "Shared IP"
      help: "This applicant shares an IP address (or, for IPv6, the containing /64
        network) with one or more other requests on this instance. That can be an
        innocent coincidence (a shared network, a school, an office) but it can
        also mean the same person is submitting multiple applications at once.
        iCloud Private Relay and Tor addresses are shared by strangers, so they
        are not compared."
    datacenter_asn:
      label: "Datacenter ASN"
      help: "The signup came from an IP address belonging to a hosting or cloud
        provider rather than a residential or mobile network. Real applicants
        rarely sign up directly from a datacenter, so this often indicates a VPN,
        proxy, or automated signup."
    tor_relay:
      label: "Tor relay"
      help: "The signup came from the address of a known, currently running Tor
        exit or relay node. Tor use isn't inherently suspicious, but it does make
        it much harder to tell repeat or automated signups apart from genuine new
        applicants."
    ai_bot:
      label: "AI bot"
      help: "The address belongs to a mailbox service built for AI agents and other
        software, recognised by its domain or its mail servers. A person can sign up
        for these too, but the address is more likely to be read by a program."
    test_mail:
      label: "Test mail"
      help: "The address belongs to a service for testing email in software, whose
        inboxes are read by programs and are easy to create in bulk. It is rarely
        where a person keeps their own mail."
    disposable_mail:
      label: "Disposable mail"
      help: "The address belongs to a disposable mail service, recognised by its mail
        servers, their addresses, or a domain seen to be one of its own. The public list behind the
        Disposable email flag doesn't have this domain yet: such services add new
        domains all the time."
    amazon_ses_inbound:
      label: "Amazon SES inbound"
      help: "Mail for this domain is received by Amazon SES, which hands it to
        software rather than to a mailbox. Automated inbox services are often built
        on it, but so are some people's own domains, forwarded to a personal mailbox.
        The mail servers can't tell these apart: look at the domain itself."
    inbound_email_api:
      label: "Inbound email API"
      help: "Mail for this domain is received by an email API (SendGrid Inbound
        Parse, Mailgun or Postmark), which passes it to a program. That is a signal
        rather than proof: some domains use these services just to forward mail."
    cloudflare_email_routing:
      label: "Cloudflare Email Routing"
      help: "Mail for this domain is forwarded by Cloudflare to a mailbox elsewhere,
        which stays hidden. Many people use it for their own domains, and throwaway
        domains use it too. Nothing suspicious on its own."
    domain_forwarding:
      label: "Email forwarding"
      help: "Mail for this domain goes to a forwarding service (ImprovMX or Forward
        Email) or the domain's registrar (Namecheap or Porkbun), which forwards it to
        a mailbox elsewhere that stays hidden. Forward Email can also keep the mailbox
        itself. Many people use these for their own domains. Nothing suspicious on its
        own."
    email_alias:
      label: "Email alias"
      help: "The address is an alias from a privacy service (such as SimpleLogin,
        Proton Pass, addy.io, DuckDuckGo, Firefox Relay or Sign in with Apple),
        which forwards mail to a mailbox that stays hidden. Many people use these
        to protect their real address. Nothing suspicious on its own."
    gmail:
      label: "Gmail"
      help: "Mail for this domain goes to Gmail's consumer mail servers. For
        information only."
    google_workspace:
      label: "Google Workspace"
      help: "Mail for this domain is hosted by Google Workspace, usually for an
        organisation or a personal domain. For information only."
    office365:
      label: "Office 365"
      help: "Mail for this domain is hosted by Microsoft 365, usually for an
        organisation. For information only."
    outlook_com:
      label: "Outlook.com"
      help: "Mail for this domain goes to Microsoft's consumer mail servers, those
        of Outlook.com and Hotmail. For information only."
    icloud_mail:
      label: "iCloud Mail"
      help: "Mail for this domain is hosted by Apple iCloud. For information only."
    yahoo_mail:
      label: "Yahoo Mail"
      help: "Mail for this domain is hosted by Yahoo. For information only."
    proton_mail:
      label: "Proton Mail"
      help: "Mail for this domain is hosted by Proton. For information only."
    fastmail:
      label: "Fastmail"
      help: "Mail for this domain is hosted by Fastmail. For information only."
    zoho_mail:
      label: "Zoho Mail"
      help: "Mail for this domain is hosted by Zoho. For information only."
    gmx_web_de:
      label: "GMX / WEB.DE"
      help: "Mail for this domain is hosted by GMX or WEB.DE. For information only."
    yandex_mail:
      label: "Yandex Mail"
      help: "Mail for this domain is hosted by Yandex. For information only."
    qq_mail:
      label: "QQ Mail"
      help: "Mail for this domain is hosted by Tencent QQ Mail. For information only."
    feishu_lark:
      label: "Feishu / Lark"
      help: "Mail for this domain is hosted by Feishu (Lark), a workspace suite. For
        information only."
    tuta_mail:
      label: "Tuta Mail"
      help: "Mail for this domain is hosted by Tuta. For information only."
    posteo:
      label: "Posteo"
      help: "Mail for this domain is hosted by Posteo. For information only."
    mailfence:
      label: "Mailfence"
      help: "Mail for this domain is hosted by Mailfence. For information only."
    mailo:
      label: "Mailo"
      help: "Mail for this domain is hosted by Mailo. For information only."
    seznam:
      label: "Seznam"
      help: "Mail for this domain is hosted by Seznam. For information only."
    t_online:
      label: "T-Online"
      help: "Mail for this domain is hosted by Deutsche Telekom's T-Online. For
        information only."
    vivaldi_mail:
      label: "Vivaldi Mail"
      help: "Mail for this domain is hosted by Vivaldi. For information only."
    onion_mail:
      label: "Onion Mail"
      help: "Mail for this domain is hosted by Onion Mail, an anonymity-focused
        provider. For information only."
    jp_carrier_isp:
      label: "Japanese carrier or ISP"
      help: "Mail for this domain goes to the mail servers of a Japanese mobile
        carrier or internet provider. For information only."
    reapplication:
      label: "Reapplication"
      help: "This application matches one or more earlier requests on this
        instance that were rejected. The same email address is critical if it was
        confirmed on a rejected request: that is almost certainly the same person.
        If it never was, this is only a warning, since anyone can sign up with
        someone else's address and the applicant may be its real owner. The same
        network (IP address, or for IPv6 the /64) is only a warning, since networks
        are shared; iCloud Private
        Relay and Tor addresses are not compared. Rejections are remembered for
        the retention period. It's surfaced so a moderator can decide whether the
        applicant addressed the reason for the earlier rejection."
    keyword_hit:
      label: "Watchword match"
      help: "Something of the application (join reason, profile note, display name, username)
        matched one of this instance's configured watchwords, in a field that watchword
        is set to check.
        Watchwords are moderator-edited phrases (see the Watchwords page) meant to
        catch known spam wording or topics the instance wants a human to review."
    email_active_elsewhere:
      label: "Email active elsewhere"
      help: "This applicant's email address is already active on another
        participating instance, and is confirmed on both. Addresses not known to be
        confirmed are not compared, since anyone can sign up with someone else's
        address, so applicants on instances that postpone confirmation emails do
        not match while they are pending. That can be entirely normal for someone with
        multiple accounts, but it's useful context when weighing an application."
    ip_active_elsewhere:
      label: "IP active elsewhere"
      help: "This applicant's IP address (or, for IPv6, the containing /64 network)
        is already associated with requests on other participating instances. This
        is shared context across instances, not proof of anything on its own.
        iCloud Private Relay and Tor addresses are shared by strangers, so they
        are not compared."
    similar_reason:
      label: "Similar join reason"
      help: "The applicant's join reason is nearly identical, word for word, to one
        or more other requests. Coordinated or scripted signups often reuse the
        same or templated wording, which is what this flag looks for. A single
        match on this instance is informational, since two people can write the
        same thing; several matches, or one on another participating instance, is
        a warning."
    signup_burst:
      label: "Signup burst"
      help: "A cluster of signups arrived within a short window of each other, from
        multiple networks, sharing a pattern such as the same email domain and a
        similar username shape. This is the kind of pattern automated signup
        campaigns produce. On this instance alone it is informational, since a
        wave of genuine newcomers can look the same; a burst that also spans other
        participating instances is a warning."
    app_signup:
      label: "Signed up via app"
      help: "This account was created through an app, such as a mobile app. That's a
        normal way to sign up, but it's noted because spammers commonly do it too: Mastodon's
        API lets an app sign up without any additional checks the website's own form might
        present. From Mastodon 5.0, apps can use that website form instead, and Mastodon
        doesn't say which of the two an app used."
