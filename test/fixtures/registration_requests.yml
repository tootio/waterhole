# Fixtures are inserted with raw SQL, so the before_validation that derives
# email_domain and canonical_email_hash from the address never runs. They are
# computed here instead, which also keeps the cross-instance match key visible
# rather than magical.
pending_alpha:
  instance: alpha
  mastodon_account_id: "1001"
  username: rowan
  email: rowan@fastmail.com
  email_domain: fastmail.com
  canonical_email_hash: <%= EmailCanonicalizer.hash_for("rowan@fastmail.com") %>
  invite_request: I have been on a smaller server for two years and want a stronger local community.
  signed_up_at: <%= 3.hours.ago.to_fs(:db) %>
  status: pending
  confirmed: true

claimed_alpha:
  instance: alpha
  mastodon_account_id: "1002"
  username: claimed
  email: claimed@example.org
  email_domain: example.org
  canonical_email_hash: <%= EmailCanonicalizer.hash_for("claimed@example.org") %>
  invite_request: A perfectly reasonable explanation of why I would like to join.
  signed_up_at: <%= 4.hours.ago.to_fs(:db) %>
  status: pending
  confirmed: true
  claimed_by: blake
  claimed_at: <%= 10.minutes.ago.to_fs(:db) %>
  # Fixtures bypass counter caches, so this is primed to match notes.yml.
  notes_count: 1

